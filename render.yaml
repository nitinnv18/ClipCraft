services:
  - type: redis
    name: clipcraft-redis
    plan: standard
    ipAllowList: []

  - type: web
    name: clipcraft-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: clipcraft-shared-secrets
      - key: REDIS_URL
        fromService:
          type: redis
          name: clipcraft-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_MODE
        value: cloud
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: clipcraft
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:3001,https://clipcraft.vercel.app,https://clipcraft-v1.vercel.app,https://clipcraft-v1-admin.vercel.app,https://clipcraft-admin.vercel.app"
      - key: ALLOWED_ORIGIN_REGEX
        value: "^https://[a-zA-Z0-9_-]*clipcraft[a-zA-Z0-9_-]*\\.vercel\\.app$"

  - type: worker
    name: clipcraft-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard
    region: oregon
    dockerCommand: python -m app.workers.video_worker
    envVars:
      - fromGroup: clipcraft-shared-secrets
      - key: REDIS_URL
        fromService:
          type: redis
          name: clipcraft-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_MODE
        value: cloud
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: clipcraft
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo

# Shared Environment Variables across web services & background workers
# Prevents mismatched independent generateValue strings for JWT_SECRET
envVarGroups:
  - name: clipcraft-shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
